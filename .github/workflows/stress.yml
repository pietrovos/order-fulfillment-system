name: Reservation stress

# The regular CI run already races the 7-of-10 scenario 50 times. This repeats the whole concurrency
# suite in fresh JVMs and containers to catch anything rarer.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Number of suite runs (50 races each)
        default: '10'

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: scripts/stress-reservations.sh "${{ github.event.inputs.runs || '10' }}"
