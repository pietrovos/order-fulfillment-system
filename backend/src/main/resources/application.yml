spring:
  application:
    name: fulfillops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5452/fulfillops}
    username: ${DB_USER:fulfillops}
    password: ${DB_PASSWORD:fulfillops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

fulfillops:
  jwt:
    # Dev-only default. Production must set JWT_SECRET (base64, >= 32 bytes).
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
    ttl: ${JWT_TTL:PT8H}
    issuer: fulfillops
  seed:
    demo-users: ${SEED_DEMO_USERS:true}
  jobs:
    poll-enabled: ${JOBS_POLL_ENABLED:true}
    poll-interval: ${JOBS_POLL_INTERVAL:PT0.5S}
