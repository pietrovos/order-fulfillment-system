spring:
  application:
    name: fulfillops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5452/fulfillops}
    username: ${DB_USER:fulfillops}
    password: ${DB_PASSWORD:fulfillops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
